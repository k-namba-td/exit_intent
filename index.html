<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Tracking verification page for exit intent</title>
  <style>
    html, body{
        margin: 0;
        height: 0;
    }
    .wrapper{
        padding: 0 30px 30px;
    }
    .heading{
        font-size: 26px;
        text-align: center;
    }
    .timer-container{
        display: flex;
        justify-content: center;
        text-align: center;
    }
    .timer-container > form{
        display: inline-block;
    }
    .timer-container > form > .form-block{
        font-size: 13px;
        text-align: left;
        margin: 0 0 4px;
    }
    input{
        vertical-align: middle;
    }
    .timer-container > form #num{
        font-size: 14px;
        width: 4em;
        height: 20px;
        border: 1px solid #aaa;
        border-radius: 2px;
        padding: 0 2px;
    }
    .timer-container > form #check-cursor{
        font-size: 16px;
        width: 16px;
        height: 16px;
        border: 1px solid #aaa;
    }
    .timer-container > #set-timer-button{
        height: 46px;
        border: none;
        padding: 0 40px;
        background-color: #666;
        color: #fff;
        border-radius: 2px;
        cursor: pointer;
        margin: 0 0 0 10px;
    }
    .log-container{

    }
    .log-container > .log{
        box-sizing: border-box;
        background-color: #fafafa;
        border: 1px solid #aaa;
        padding: 20px 30px;
    }
    .log-container > .log > .timestamp{
        font-size: 12px;
        display: block;
        color: #3f3f3f;
    }
    .focus-info.blur{
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        border: 50px solid rgba(40,40,40,0.5);
        display: block;
        pointer-events: none;
        box-sizing: border-box;
    }
    .focus-info.blur::after{
        content: "blur (Out of focus)";
        position: fixed;
        top: 15px;
        left: 15px;
        font-size: 14px;
        color: #fff;
    }
  </style>
</head>
<body>
<div class="wrapper" id="js-wrapper">
  <h1 class="heading">Tracking verification page for exit intent</h1>
  <div class="timer-container">
    <form>
        <div class="form-block">
            <label for="num">Number of seconds for the timer:</label>
            <input type="number" id="num" name="seconds" value="10">
        </div>
        <div class="form-block">
            <label for="check-cursor">Timer Cancellation Based on User Behavior (Active in 5s):</label>
            <input type="checkbox" id="check-cursor" name="check-cursor">
        </div>
    </form>
    <button id="set-timer-button">Start TImer</button>
  </div>
  <div class="log-container" id="js-log-container">
  </div>
</div>
<div class="focus-info" id="js-focus-info"></div>
</body>
<script>
const wrapper = document.getElementById("js-wrapper");
const setTimerButon =document.getElementById("set-timer-button");
const focusInfo = document.getElementById("js-focus-info");
let timer = null;
let timerForOption = null;
const writeLog = (text) => {
    const log = document.createElement("p");
    const container = document.getElementById("js-log-container");
    const options = {
        year: 'numeric',
        month: '2-digit',
        day: '2-digit',
        hour: '2-digit',
        minute: '2-digit',
        second: '2-digit',
        hour12: false
    };
    const timestamp = new Intl.DateTimeFormat('ja-JP', options).format(new Date());
    log.innerHTML = `<span class="timestamp">${timestamp}</span>${text}`;
    log.classList.add("log");
    container.prepend(log);
}
setTimerButon.addEventListener("click", (e) => {
    const sec = (document.getElementById("num").value || 0) * 1000;
    const option = document.getElementById("check-cursor").checked;
    console.log(e);
    if(timer) clearTimeout(timer);
    if(timerForOption) clearTimeout(timerForOption);
    timer = setTimeout(() => {
        writeLog("Timer ends.");
        document.removeEventListener("mousemove", stopTimer);
        document.removeEventListener("scroll", stopTimer);
        document.removeEventListener("mousedown", stopTimer);
        document.removeEventListener("touchstart", stopTimer);
    }, sec);
    writeLog("Start timer.");
    if(option){
        timerForOption = setTimeout(() => {
            document.addEventListener("mousemove", stopTimer);
            document.addEventListener("scroll", stopTimer);
            document.addEventListener("mousedown", stopTimer);
            document.addEventListener("touchstart", stopTimer);
        }, 5*1000);
    }
    function stopTimer(e){
        console.log("stopTimer", e)
        if(timer) clearTimeout(timer);
        writeLog(`Timer ends when "${e.type}" is detected.`);
        document.removeEventListener("mousemove", stopTimer);
        document.removeEventListener("scroll", stopTimer);
        document.removeEventListener("mousedown", stopTimer);
        document.removeEventListener("touchstart", stopTimer);
        
    }
});
document.addEventListener("visibilitychange", (e) => {
    console.log(e)
    if(document.visibilityState === "hidden"){
        writeLog(`Detects the "visibilitychange" event and determines that "visibilityState" has become hidden`);
    }
});
document.addEventListener("mouseleave", (e) => {
    console.log(e);
    const width = window.innerWidth;
    const height = window.innerHeight;
    const isOutside = e.clientX <= 0 || e.clientX >= width || e.clientY <= 0 || e.clientY >= height;
    if(isOutside) writeLog(`Detects the "mouseleave" event and determines that the mouse cursor has moved off-screen.`);
});
window.addEventListener('focus', (e) => {
  console.log(e);
  writeLog(`Detected a "focus" event and determined that focus had returned to the window.`);
  focusInfo.classList.remove("blur");
});
window.addEventListener('blur', (e) => {
  console.log(e);
  writeLog(`Detects "blur" event and determines that focus has been lost from the window.`);
  focusInfo.classList.add("blur");
});
</script>
</html>
