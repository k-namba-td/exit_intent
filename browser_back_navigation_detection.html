<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>Verification of browser back navigation detection</title>
  <style>
    html, body{
        margin: 0;
        height: 0;
    }
    .wrapper{
        padding: 0 30px 30px;
    }
    .heading{
        font-size: 26px;
        text-align: center;
    }
    .introduction{
        font-size: 16px;
        text-align: center;
    }
    .popup{
        position: fixed;
        z-index: 1;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        width: 400px;
        height: 400px;
        background-color: #aaa;
        color: #fff;
        font-weight: bold;
        font-size: 24px;
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: rgba(0, 0, 0, 0.2) 0px 6px 10px;
        opacity: 0;
        transition: opacity 0.4s ease-out;
        visibility: hidden;
    }
    .popup.displayed{
        visibility: visible;
        opacity: 1;
    }
    .close-button{
        position: absolute;
        z-index: 3;
        right: -10px;
        top: -10px;
        display: block;
        width: 28px;
        height: 28px;
        border: 1px solid #aaa;
        border-radius: 50%;
        padding: 0;
        margin: 0;
        cursor: pointer;
        background-color: #fff;
    }
    .close-button::before{
        content: "";
        position: absolute;
        width: 14px;
        height: 2px;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) rotate(45deg);
        transform-origin: center center;
        background-color: #888;
    }
    .close-button::after{
        content: "";
        position: absolute;
        width: 14px;
        height: 2px;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%) rotate(135deg);
        transform-origin: center center;
        background-color: #888;
    }
  </style>
</head>
<body>
<div class="wrapper" id="js-wrapper">
  <h1 class="heading">Verification of browser back navigation detection</h1>
  <p class="introduction">The popup opens on browser back navigation if the URL includes the query parameter "popup_test=true".</p>
  <div class="popup" id="js-popup">popup<button class="close-button" id="js-close-button"></button></div>
</div>
</body>
<script>
const popup = document.getElementById("js-popup");
const closeButton = document.getElementById("js-close-button");
const isPopup = /[?&]popup_test=true(?:[#&]|$)/.test(location.search);
const setPopup = () => {
    window.history.pushState(null, '', window.location.href);
    window.addEventListener('popstate', (e) => {
        popup.classList.add("displayed");
    });
    closeButton.addEventListener("click", (e) => {
        popup.classList.remove("displayed");
    });
}
if(isPopup) setPopup();
</script>
</html>
